##### TOKYO NIGHT STORM THEME #####

set-option -g default-shell $SHELL

# Enable the status bar
set -g status on
set -g status-style "bg=#1f2335,fg=#c0caf5"

# Active window style
set-window-option -g window-status-current-style "fg=#7aa2f7,bold"
set-window-option -g window-status-current-format " #[bold]#I:#W "

# Inactive window style
set-window-option -g window-status-style "bg=default,fg=#565f89"
set-window-option -g window-status-format " #I:#W "

# Pane border colors
set -g pane-border-style "fg=#292e42"          # Inactive pane border
set -g pane-active-border-style "fg=#7aa2f7"   # Active pane border (blue)

# Command prompt / message bar (rename-window, etc.)
set -g message-style "bg=#3d59a1,fg=#c0caf5"
set -g message-command-style "bg=#3d59a1,fg=#c0caf5"

# Copy mode selection and search highlights
set -g mode-style "bg=#3d59a1,fg=#c0caf5"
set -g copy-mode-match-style "bg=#ff9e64,fg=#1f2335"
set -g copy-mode-current-match-style "bg=#e0af68,fg=#1f2335"

# Pane number overlay (prefix + q)
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"

# Clock mode (used by prefix + t)
set -g clock-mode-colour "#7aa2f7"
set -g clock-mode-style 24

# Status bar padding (optional aesthetic tweak)
set -g status-left-length 20
set -g status-right-length 60
set -g status-interval 5

# Clean up status bar sides
set -g status-left ''
set -g status-right '#[fg=#c0caf5,bg=#3d59a1] %H:%M:%S '

# Open splits in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Use mouse (tmux ≥ 2.1)
set -g mouse on

# Set copy to clipboard on
set -g set-clipboard on

##### PLUGINS #####

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically restore sessions on tmux start
set -g @continuum-restore 'on'

# Optional: auto-save every 10 minutes instead of default 15
set -g @continuum-save-interval '10'

# Initialize TPM delete - final step
run '~/.tmux/plugins/tpm/tpm'
